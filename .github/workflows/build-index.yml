name: Build Community Index

on:
  push:
    branches: [main]
    paths:
      - "blueprints/**"
      - "dynamic-overlays/**"
      - "scripts/validate_and_index.py"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and validate index.json
        run: python scripts/validate_and_index.py --strict --write-index

      - name: Commit updated index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: rebuild community index.json [skip ci]"
          git push
